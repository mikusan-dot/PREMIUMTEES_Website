# Render deployment configuration — Premium Tees
# Client static site with SPA fallback for React Router client-side routes.

services:
  - type: web
    name: premium-tees-client
    env: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    # Rewrite client-side routes to index.html so React Router handles them.
    # Status 200 keeps the URL (e.g. /checkout) while serving index.html.
    # Existing static files (assets, index.html) are served directly first.
    redirects:
      - source: /*
        destination: /index.html
        status: 200
