# Render deployment configuration - Premium Tees
# Client static site with SPA fallback for React Router client-side routes.

services:
  - type: web
    name: premium-tees-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      # Backend origin (no trailing slash, no /api suffix)
      - key: VITE_API_URL
        value: https://premiumtees-website.onrender.com
    routes:
      # Rewrite client-side routes to index.html so React Router handles them.
      - type: rewrite
        source: /*
        destination: /index.html
